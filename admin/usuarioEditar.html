<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQUA-T Admin - Editar Usuario</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/manejoDeSesion.js"></script>
    <script>const sesionActual = requerirRol(["Administrador"]);</script>
    <script src="../js/regiones.js"></script>
    <script src="../js/admin/adminUsuarios.js"></script>
    <script src="../js/admin/usuarioFormulario.js"></script>
</head>
<body>

    <div class="admin-layout">
 
    <aside class="admin-sidebar">
      <a class="admin-brand" href="admin_home.html">
        <img src="../assetsimg/logo.png" alt="Logo de la empresa">
        AQUA-T Admin
      </a>
 
      <ul class="admin-nav">
        <li>
          <a class="admin-nav-link" href="admin_home.html">Dashboard</a>
        </li>
        <li>
          <a class="admin-nav-link" href="admin_productos.html">Productos</a>
        </li>
        <li>
          <a class="admin-nav-link activo" href="admin_usuarios.html">Usuarios</a>
        </li>
      </ul>
 
      <div class="admin-volver">
        <a href="../home.html">&larr; Volver a la tienda</a>
      </div>
    </aside>
 
    <main class="admin-contenido">
 
      <div class="admin-header">
        <h1 id="tituloFormularioUsuario">Editar usuario</h1>
        <a href="admin_usuarios.html" class="btn btn-outline-primary">&larr; Volver al listado</a>
      </div>
 
      <div class="admin-panel">
        <form id="formUsuario" novalidate>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="run" class="form-label">RUN</label>
              <input type="text" class="form-control" id="run" placeholder="Ej: 19011022K" maxlength="9">
              <div class="form-text">Sin puntos ni guion. Entre 7 y 9 caracteres.</div>
              <div id="runFeedback" class="campo-error"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" maxlength="50">
              <div class="form-text">Máx. 50 caracteres</div>
              <div id="nombreFeedback" class="campo-error"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="apellidos" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" maxlength="100">
              <div class="form-text">Máx. 100 caracteres</div>
              <div id="apellidosFeedback" class="campo-error"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="correo" class="form-label">Correo</label>
              <input type="email" class="form-control" id="correo" maxlength="100">
              <div class="form-text">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com</div>
              <div id="correoFeedback" class="campo-error"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="fechaNacimiento" class="form-label">Fecha de nacimiento (opcional)</label>
              <input type="date" class="form-control" id="fechaNacimiento">
              <div id="fechaNacimientoFeedback" class="campo-error"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="rolUsuario" class="form-label">Tipo de usuario</label>
              <select class="form-select" id="rolUsuario">
                <option value="">-- Seleccione el tipo --</option>
              </select>
              <div id="rolFeedback" class="campo-error"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="region" class="form-label">Región</label>
              <select class="form-select" id="region">
                <option value="">-- Seleccione la región --</option>
              </select>
              <div id="regionFeedback" class="campo-error"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="comuna" class="form-label">Comuna</label>
              <select class="form-select" id="comuna" disabled>
                <option value="">-- Seleccione la comuna --</option>
              </select>
              <div id="comunaFeedback" class="campo-error"></div>
            </div>
          </div>
          <div class="mb-3">
            <label for="direccion" class="form-label">Dirección</label>
            <input type="text" class="form-control" id="direccion" maxlength="300">
            <div class="form-text">Máx. 300 caracteres</div>
            <div id="direccionFeedback" class="campo-error"></div>
          </div>
          <div id="mensajeForm" class="mb-3"></div>
          <button type="submit" id="botonGuardarUsuario" class="btn btn-enviar">Guardar cambios</button>
        </form>
      </div>
    </main>
  </div>
    
</body>
</html>
