<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQUA-T Admin - Panel de administración</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/admin/adminProductos.js"></script>
    <script src="../js/admin/adminUsuarios.js"></script>
</head>
<body>

    <div class="admin-layout">
 
    <aside class="admin-sidebar">
      <a class="admin-brand" href="index.html">
        <img src="../assetsimg/logo.png" alt="Logo de la empresa">
        AQUA-T Admin
      </a>
 
      <ul class="admin-nav">
        <li>
          <a class="admin-nav-link activo" href="admin_home.html">Dashboard</a>
        </li>
        <li>
          <a class="admin-nav-link" href="admin_productos.html">Productos</a>
        </li>
        <li>
          <a class="admin-nav-link" href="admin_usuarios.html">Usuarios</a>
        </li>
      </ul>
 
      <div class="admin-volver">
        <a href="../home.html">&larr; Volver a la tienda</a>
      </div>
    </aside>
 
    <!-- Contenido principal -->
    <main class="admin-contenido">
 
      <div class="admin-header">
        <h1>¡Hola Administrador!</h1>
      </div>
 
      <div class="row g-4 mb-4">
        <div class="col-12 col-sm-6 col-md-4">
          <div class="admin-card-stat">
            <div class="admin-stat-numero" id="totalProductos">0</div>
            <div class="admin-stat-label">Productos registrados</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
          <div class="admin-card-stat">
            <div class="admin-stat-numero" id="totalUsuarios">0</div>
            <div class="admin-stat-label">Usuarios registrados</div>
          </div>
        </div>
      </div>
 
      <div class="admin-panel">
        <p class="mb-0">
          Desde este panel puedes gestionar el catálogo de productos y los usuarios
          del sistema AQUA-T. Usa el menú lateral para navegar entre las secciones.
        </p>
      </div>
 
    </main>
 
  </div>
 
  <script>
    document.getElementById("totalProductos").textContent = obtenerProductos().length;
    document.getElementById("totalUsuarios").textContent = obtenerUsuarios().length;
  </script>
    
</body>
</html>
