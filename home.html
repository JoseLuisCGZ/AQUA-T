<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUA-T - Inicio</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --azul-profundo: #003554;
      --azul-medio: #006494;
      --aqua: #00a8cc;
      --aqua-claro: #6bf0d6;
      --fondo-claro: #f0fbfa;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--fondo-claro);
    }

    
    .navbar-custom {
      background: linear-gradient(90deg, var(--azul-profundo) 0%, var(--azul-medio) 55%, var(--aqua) 100%);
      box-shadow: 0 2px 10px rgba(0, 53, 84, 0.25);
    }

    .navbar-custom .navbar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff !important;
      letter-spacing: 0.5px;
    }

    .navbar-custom .navbar-brand img {
      height: 45px;
      width: 45px;
      object-fit: contain;
      border-radius: 8px;
    }

    .navbar-custom .nav-link {
      color: rgba(255, 255, 255, 0.9) !important;
      font-weight: 500;
      margin: 0 0.25rem;
      padding: 0.45rem 0.7rem !important;
      border-radius: 6px;
      white-space: nowrap;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .navbar-custom .nav-link:hover,
    .navbar-custom .nav-link:focus {
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff !important;
    }

    .navbar-custom .nav-link.active {
      background-color: var(--aqua-claro);
      color: var(--azul-profundo) !important;
    }

    /* Franja siempre horizontal: en pantallas chicas se achica el texto
       y el menú permite scroll lateral en vez de colapsar hacia abajo */
    @media (max-width: 576px) {
      .navbar-custom .navbar-brand {
        font-size: 1.1rem;
      }

      .navbar-custom .navbar-brand img {
        height: 34px;
        width: 34px;
      }

      .navbar-custom .nav-link {
        font-size: 0.85rem;
        padding: 0.4rem 0.5rem !important;
      }

      .navbar-nav.flex-row {
        overflow-x: auto;
        flex-wrap: nowrap;
      }
    }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--aqua) 0%, var(--azul-medio) 100%);
      color: #ffffff;
      padding: 5rem 1rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 2rem auto;
      opacity: 0.95;
    }

    .btn-aqua {
      background-color: #ffffff;
      color: var(--azul-profundo);
      font-weight: 600;
      padding: 0.7rem 2rem;
      border-radius: 50px;
      border: none;
      transition: transform 0.2s ease;
    }

    .btn-aqua:hover {
      transform: translateY(-2px);
      background-color: var(--aqua-claro);
      color: var(--azul-profundo);
    }
  </style>
</head>
<body>


  <nav class="navbar navbar-expand navbar-custom sticky-top">
    <div class="container d-flex flex-nowrap align-items-center">
      
      <a class="navbar-brand flex-shrink-0" href="#inicio">
        <img src="assetsimg/logo.png" alt="Logo de la empresa">
        AQUA-T
      </a>

      <ul class="navbar-nav flex-row ms-auto">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#productos">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#nosotros">Nosotros</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#blog">Blog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#contacto">Contacto</a>
        </li>
      </ul>
    </div>
  </nav>


</body>
</html>
