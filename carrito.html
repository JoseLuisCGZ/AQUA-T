<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUA-T - Mi carrito</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/carrito.js" defer></script>
</head>
<body>

  <nav class="navbar navbar-expand navbar-custom sticky-top">
    <div class="container d-flex flex-nowrap align-items-center">
      <a class="navbar-brand flex-shrink-0" href="home.html">
        <img src="assetsimg/logo.png" alt="Logo de la empresa">
        AQUA-T
      </a>
      <ul class="navbar-nav flex-row ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="nav-link active" href="nosotros.html">Nosotros</a></li>
        <li class="nav-item"><a class="nav-link active" href="blogs.html">Blog</a></li>
        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        <li class="nav-item">
          <a class="icono-carrito" href="carrito.html">
            🛒 Carrito
            <span id="contadorCarrito" class="badge-carrito" style="display:none;">0</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <section class="py-5">
    <div class="container" style="max-width: 900px;">
      <h1 class="fw-bold mb-4" style="color: var(--azul-profundo);">Mi carrito de compras</h1>

      <div id="contenedorCarrito">
        <!-- Los items se renderizan acá con JS -->
      </div>

      <div class="row mt-4" id="resumenWrapper" style="display:none;">
        <div class="col-12 col-md-6 ms-auto">
          <div class="resumen-carrito">

            <div class="input-group mb-3">
              <input type="text" id="inputCupon" class="form-control" placeholder="Ingresa el cupón de descuento">
              <button class="btn btn-outline-primary" id="btnAplicarCupon" type="button">Aplicar</button>
            </div>
            <div id="mensajeCupon" class="small mb-3"></div>

            <div class="d-flex justify-content-between mb-2">
              <span>Subtotal</span>
              <span id="subtotalTexto">$0</span>
            </div>
            <div class="d-flex justify-content-between mb-3" id="descuentoFila" style="display:none;">
              <span>Descuento</span>
              <span id="descuentoTexto" class="text-success">-$0</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-3">
              <strong>Total</strong>
              <strong id="totalTexto" style="color: var(--azul-profundo);">$0</strong>
            </div>

            <button class="btn btn-enviar w-100" id="btnPagar">Pagar</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p class="mb-0">© 2026 AQUA-T Derechos Reservados</p>
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', () => {

    // Cupón de ejemplo válido: AQUA10 (10% de descuento).
    let descuentoAplicado = 0;

    function renderizarCarrito() {
      const carrito = obtenerCarrito();
      const contenedor = document.getElementById('contenedorCarrito');
      const resumenWrapper = document.getElementById('resumenWrapper');

      if (carrito.length === 0) {
        contenedor.innerHTML = `
          <div class="carrito-vacio">
            <p class="fs-5 text-muted">Tu carrito está vacío.</p>
            <a href="productos.html" class="btn btn-primary">Ver productos</a>
          </div>`;
        resumenWrapper.style.display = 'none';
        return;
      }

      resumenWrapper.style.display = 'flex';

      contenedor.innerHTML = carrito.map((item) => `
        <div class="fila-carrito" data-id="${item.id}">
          <img src="${item.imagen}" alt="${item.nombre}">
          <div class="info-producto">
            <h6 class="mb-1">${item.nombre}</h6>
            <div>${formatearCLP(item.precio)} c/u</div>
            <button class="btn-eliminar-item" data-accion="eliminar" data-id="${item.id}">Eliminar</button>
          </div>
          <div class="control-cantidad">
            <button data-accion="restar" data-id="${item.id}">−</button>
            <input type="number" min="1" max="20" value="${item.cantidad}" data-accion="input" data-id="${item.id}">
            <button data-accion="sumar" data-id="${item.id}">+</button>
          </div>
          <div class="fw-bold" style="min-width: 90px; text-align:right;">
            ${formatearCLP(item.precio * item.cantidad)}
          </div>
        </div>
      `).join('');

      actualizarTotales();
    }

    function actualizarTotales() {
      const carrito = obtenerCarrito();
      const subtotal = calcularSubtotal(carrito);
      const total = subtotal - descuentoAplicado;

      document.getElementById('subtotalTexto').textContent = formatearCLP(subtotal);
      document.getElementById('totalTexto').textContent = formatearCLP(Math.max(total, 0));

      const descuentoFila = document.getElementById('descuentoFila');
      if (descuentoAplicado > 0) {
        descuentoFila.style.display = 'flex';
        document.getElementById('descuentoTexto').textContent = '-' + formatearCLP(descuentoAplicado);
      } else {
        descuentoFila.style.display = 'none';
      }
    }

    document.getElementById('contenedorCarrito').addEventListener('click', (e) => {
      const boton = e.target.closest('button');
      if (!boton) return;

      const id = boton.dataset.id;
      const accion = boton.dataset.accion;
      const carrito = obtenerCarrito();
      const item = carrito.find((p) => p.id === id);
      if (!item) return;

      if (accion === 'sumar') actualizarCantidad(id, item.cantidad + 1);
      if (accion === 'restar') actualizarCantidad(id, item.cantidad - 1);
      if (accion === 'eliminar') eliminarDelCarrito(id);

      renderizarCarrito();
    });

    document.getElementById('contenedorCarrito').addEventListener('change', (e) => {
      if (e.target.dataset.accion !== 'input') return;
      actualizarCantidad(e.target.dataset.id, e.target.value);
      renderizarCarrito();
    });

    document.getElementById('btnAplicarCupon').addEventListener('click', () => {
      const codigo = document.getElementById('inputCupon').value.trim().toUpperCase();
      const mensaje = document.getElementById('mensajeCupon');
      const subtotal = calcularSubtotal(obtenerCarrito());

      if (codigo === 'AQUA10') {
        descuentoAplicado = subtotal * 0.10;
        mensaje.textContent = 'Cupón aplicado: 10% de descuento.';
        mensaje.className = 'small mb-3 text-success';
      } else {
        descuentoAplicado = 0;
        mensaje.textContent = 'Cupón inválido.';
        mensaje.className = 'small mb-3 text-danger';
      }
      actualizarTotales();
    });

    document.getElementById('btnPagar').addEventListener('click', () => {
      if (obtenerCarrito().length === 0) return;
      alert('¡Compra simulada con éxito! Gracias por tu compra en AQUA-T.');
      vaciarCarrito();
      descuentoAplicado = 0;
      renderizarCarrito();
    });

    renderizarCarrito();

  });
</script>

</body>
</html>
