<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQUA-T - Inicio de Sesión</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/inicioSesion.js"></script>
</head>
<body>

    <nav class="navbar navbar-expand navbar-custom sticky-top">
    <div class="container d-flex flex-nowrap align-items-center">
 
      <a class="navbar-brand flex-shrink-0" href="home.html">
        <img src="assetsimg/logo.png" alt="Logo de la empresa">
        AQUA-T
      </a>
 
      <ul class="navbar-nav flex-row ms-auto">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="productos.html">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="nosotros.html">Nosotros</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="blogs.html">Blog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
        </li>
      </ul>
    </div>
  </nav>

  <section class="contacto-section">
    <div class="container">
 
      <div class="text-center mb-4">
        <img src="assetsimg/logo.png" alt="Logo AQUA-T" style="max-width: 90px;">
        <h2 class="fw-bold mt-3" style="color: var(--azul-profundo);">AQUA-T</h2>
      </div>
 
      <div class="contacto-card" style="max-width: 480px;">
        <h3 class="text-center mb-4" style="color: var(--azul-profundo);">Iniciar sesión</h3>
 
        <form id="formLogin" novalidate>
 
          <div class="mb-3">
            <label for="emailUsuario" class="form-label">Correo</label>
            <input type="email" class="form-control" id="emailUsuario" maxlength="100">
            <div id="correoHelp" class="form-text">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com</div>
            <div id="emailFeedback" class="campo-error"></div>
          </div>
 
          <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contrasena" maxlength="10">
            <div id="contrasenaHelp" class="form-text">Entre 4 y 10 caracteres</div>
            <div id="contrasenaFeedback" class="campo-error"></div>
          </div>
 
          <div id="mensajeForm" class="mb-3"></div>
 
          <button type="submit" class="btn btn-enviar w-100">Iniciar sesión</button>
 
          <p class="text-center mt-3 mb-0">
            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
          </p>
        </form>
      </div>
    </div>
  </section>
 
  <footer>
    <p class="mb-0">© 2026 AQUA-T Derechos Reservados</p>
  </footer>
    
</body>
</html>
